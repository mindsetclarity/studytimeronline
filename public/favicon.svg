<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Study Timer Online timer">
  <defs>
    <linearGradient id="t-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#50e3c2" />
      <stop offset="100%" stop-color="#29bc9b" />
    </linearGradient>
  </defs>
  <!-- Clock face -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#171717" stroke-width="8" />
  <!-- Hour hand (ink) -->
  <line x1="64" y1="64" x2="64" y2="34" stroke="#171717" stroke-width="8" stroke-linecap="round" />
  <!-- Minute hand (accent — live state) -->
  <line x1="64" y1="64" x2="92" y2="64" stroke="url(#t-accent)" stroke-width="8" stroke-linecap="round" />
  <!-- Center dot -->
  <circle cx="64" cy="64" r="7" fill="#50e3c2" />
  <style>
    @media (prefers-color-scheme: dark) {
      circle[stroke="#171717"] { stroke: #fafafa; }
      line[stroke="#171717"] { stroke: #fafafa; }
    }
  </style>
</svg>
